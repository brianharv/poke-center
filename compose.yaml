name: poke-center

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poke_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poke_center_local}
      POSTGRES_DB: ${POSTGRES_DB:-poke_center}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 uses a major-version-specific PGDATA below this directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  app:
    build:
      context: .
      target: development
    init: true
    networks:
      default:
        aliases: ["poke-center.test"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-poke_center}:${POSTGRES_PASSWORD:-poke_center_local}@db:5432/${POSTGRES_DB:-poke_center}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
      - app_generated:/app/src/generated/prisma
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  e2e:
    profiles: ["test"]
    build:
      context: .
      target: e2e
    init: true
    environment:
      PLAYWRIGHT_BASE_URL: http://poke-center.test:3000
    volumes:
      - ./artifacts/playwright-report:/app/playwright-report
      - ./artifacts/test-results:/app/test-results
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
  app_next:
  app_generated:
