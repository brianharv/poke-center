name: Dependency and container vulnerabilities

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned dependency environment
        run: docker compose build app
      - name: Report all production and development advisories
        continue-on-error: true
        run: docker compose run --rm --no-deps app pnpm audit --audit-level high
      - name: Reject high/critical production vulnerabilities
        run: docker compose run --rm --no-deps app pnpm audit --prod --audit-level high

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - node:24.22.1-bookworm-slim
          - postgres:18.6-bookworm
          - axllent/mailpit:v1.32.0
    steps:
      - uses: actions/checkout@v4
      - name: Record unfiltered container findings
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: ${{ matrix.image }}
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"
      - name: Reject findings outside reviewed exceptions
        env:
          SCAN_IMAGE: ${{ matrix.image }}
        run: >-
          trivy image --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --ignorefile .trivyignore.yaml
          --format table --output /dev/stdout --exit-code 1 "$SCAN_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-findings-${{ strategy.job-index }}
          path: trivy-report.json
          if-no-files-found: error
          retention-days: 14
