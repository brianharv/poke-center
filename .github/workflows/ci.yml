name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build development and browser-test images
        run: docker compose --profile test build
      - name: Types, lint, formatting, and production build
        run: docker compose run --rm --no-deps app sh -c 'pnpm check && pnpm build'
      - name: Start development environment
        run: docker compose up -d --wait --wait-timeout 180
      - name: Browser smoke test against PostgreSQL
        run: docker compose --profile test run --rm e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: artifacts/
          if-no-files-found: ignore
      - name: Stop services
        if: always()
        run: docker compose down
